[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burnblind"
version = "0.1.0"
description = "Environmental monitoring and incident investigation platform"
requires-python = ">=3.11"
dependencies = ["pyproj>=3.6,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
aws = ["boto3>=1.35,<2"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
